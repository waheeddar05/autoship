const C = {

function Logo({ size = 40 }) {

}

/* ── Shared UI ──────────────────────────────────── */

function Rv({ visible, delay = 0, children }) {
  return <div style={{ opacity: 1, transform: "translateY(0)" }}>{children}</div>;
}
function Badge({ children, color = C.accent }) {

}
function Ttl({ children }) {
  return <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "0 0 4px" }}><Logo size={36} /><h1 style={{ fontSize: "clamp(26px, 3vw, 40px)", fontWeight: 700, color: C.text, margin: 0, letterSpacing: "-0.5px" }}>{children}</h1></div>;
}
function Sub({ children }) {
  return <p style={{ fontSize: "clamp(14px, 1.3vw, 18px)", color: C.textMuted, margin: "0 0 28px", lineHeight: 1.5 }}>{children}</p>;
}
function Card({ icon, title, desc, color = C.accent }) {
  return (
    <div style={{ padding: "14px 16px", borderRadius: 12, background: C.bgCard, border: `1px solid ${C.border}`, display: "flex", gap: 12, alignItems: "flex-start" }}>

        <div style={{ fontSize: 14, fontWeight: 700, color, marginBottom: 2 }}>{title}</div>
        <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.5 }}>{desc}</div>

}

/* ═══════════════════════════════════════════════════
   SLIDES
   ═══════════════════════════════════════════════════ */

/* 0 ── Title ───────────────────────────────────── */
function FloatingUSP({ label, color, x, y, delay, duration }) {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    let mounted = true;
    const loop = () => {
      if (!mounted) return;
      setTimeout(() => { if (mounted) setVisible(true); }, delay);
      setTimeout(() => { if (mounted) setVisible(false); }, delay + duration);
      setTimeout(() => { if (mounted) loop(); }, delay + duration + 400);
    };
    loop();
    return () => { mounted = false; };
  }, []);
  return (
    <div style={{
      position: "absolute", left: x, top: y,
      padding: "14px 30px", borderRadius: 16,
      background: `${color}18`, border: `1.5px solid ${color}50`,
      color, fontSize: 20, fontWeight: 800, letterSpacing: "0.4px",
      opacity: visible ? 1 : 0,
      transform: visible ? "translateY(0) scale(1)" : "translateY(18px) scale(0.92)",
      transition: "opacity 0.7s ease, transform 0.7s ease",
      pointerEvents: "none", whiteSpace: "nowrap",
    }}>{label}</div>
  );
}

function S0({ step }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", textAlign: "center", position: "relative", overflow: "hidden" }}>

        Auto<span style={{ color: C.accent }}>Ship</span>
      </h1>
      <p style={{ fontSize: "clamp(20px, 2.2vw, 28px)", color: C.textMuted, margin: "0 0 12px" }}>Task In → PR Out</p>
      <div style={{ height: 20 }} />
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 40, height: 40, borderRadius: "50%", background: `${C.accent}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, color: C.accent, fontWeight: 700 }}>W</div>
        <div style={{ textAlign: "left" }}>
          <div style={{ fontSize: 16, fontWeight: 600, color: C.text }}>Waheed</div>
          <div style={{ fontSize: 13, color: C.textDim }}>Engineering Team</div>

}

/* 1 ── The Problem ─────────────────────────────── */
function S1({ step }) {
  const pains = [
    { label: "Pick up task", icon: "📋" },
    { label: "Read & setup", icon: "📖" },
    { label: "Create branch", icon: "🔀" },
    { label: "Write code", icon: "💻" },
    { label: "Push & PR", icon: "🚀" },
    { label: "Wait for review", icon: "⏳" },
    { label: "Fix comments", icon: "🔄" },
    { label: "Repeat", icon: "♻️" },
  ];
  const radius = 155;
  const centerX = 195;
  const centerY = 175;
  return (
    <div>
      <Ttl>The Problem</Ttl>
      <Sub>Manual developer workflow is slow and repetitive</Sub>
      <div style={{ display: "flex", gap: 24, alignItems: "center" }}>
        <div style={{ position: "relative", width: 390, height: 370, flexShrink: 0 }}>
          {/* Center stat */}
          <div style={{
            position: "absolute", left: centerX - 72, top: centerY - 60, width: 144, height: 120,
            borderRadius: "50%", background: `linear-gradient(145deg, ${C.red}15, ${C.orange}10)`,
            border: `2px solid ${C.red}35`, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center", textAlign: "center", zIndex: 2,
          }}>
            <div style={{ fontSize: 14 }}>⏰</div>
            <div style={{ fontSize: 28, fontWeight: 800, color: C.orange, lineHeight: 1.1 }}>~11</div>
            <div style={{ fontSize: 11, color: C.orange, fontWeight: 600 }}>days/task</div>
            <div style={{ fontSize: 9, color: C.textDim, marginTop: 2 }}>avg cycle time</div>
          </div>
          {/* Circular connecting line */}
          <svg style={{ position: "absolute", top: 0, left: 0, width: 390, height: 370, zIndex: 0 }}>
            <circle cx={centerX} cy={centerY} r={radius} fill="none" stroke={`${C.red}20`} strokeWidth="1.5" strokeDasharray="6 4" />
            {pains.map((_, i) => {
              const angle = (i / pains.length) * 2 * Math.PI - Math.PI / 2;
              const nextAngle = ((i + 1) / pains.length) * 2 * Math.PI - Math.PI / 2;
              const x1 = centerX + Math.cos(angle) * radius;
              const y1 = centerY + Math.sin(angle) * radius;
              const x2 = centerX + Math.cos(nextAngle) * radius;
              const y2 = centerY + Math.sin(nextAngle) * radius;
              const midAngle = (angle + nextAngle) / 2;
              const ax = centerX + Math.cos(midAngle) * (radius + 8);
              const ay = centerY + Math.sin(midAngle) * (radius + 8);
              return <path key={i} d={`M${x1},${y1} Q${ax},${ay} ${x2},${y2}`} fill="none" stroke={`${C.red}30`} strokeWidth="1" />;
            })}
          </svg>
          {/* Pain nodes around the circle */}
          {pains.map((p, i) => {
            const angle = (i / pains.length) * 2 * Math.PI - Math.PI / 2;
            const x = centerX + Math.cos(angle) * radius;
            const y = centerY + Math.sin(angle) * radius;
            return (
              <div key={i} style={{
                position: "absolute", left: x - 44, top: y - 28, width: 88,
                textAlign: "center", zIndex: 1,
                opacity: 1, transition: "opacity 0.4s ease",
              }}>
                <div style={{
                  width: 42, height: 42, borderRadius: "50%", margin: "0 auto 4px",
                  background: `${C.red}15`, border: `1.5px solid ${C.red}35`,
                  display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18,
                }}>
                  {p.icon}
                </div>
                <div style={{ fontSize: 10, fontWeight: 700, color: C.text, lineHeight: 1.3 }}>{p.label}</div>
              </div>
            );
          })}
        </div>
        {/* Right side - key stats */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ padding: 16, borderRadius: 14, background: `${C.orange}0a`, border: `1px solid ${C.orange}22` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <span style={{ fontSize: 22 }}>📊</span>
              <div style={{ fontSize: 16, fontWeight: 700, color: C.orange }}>~11 days average cycle time</div>
            </div>
            <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.6 }}>
              Data fetched from ClickUp — last 3 sprints, excluding outliers
            </div>
            <Badge color={C.cyan}>ClickUp data — last 3 sprints</Badge>
          </div>
          <div style={{ padding: 16, borderRadius: 14, background: `${C.red}0a`, border: `1px solid ${C.red}22` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <span style={{ fontSize: 22 }}>🔁</span>
              <div style={{ fontSize: 16, fontWeight: 700, color: C.red }}>The Never-Ending Cycle</div>
            </div>
            <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.6 }}>
              It's not just the code — it's local setup, pulling latest code, creating branches, aligning commits, PR formatting as per GitHub repos or CI/CD rules, review back-and-forth. All repeated every time.
            </div>
          </div>
          <div style={{ padding: 16, borderRadius: 14, background: `${C.purple}0a`, border: `1px solid ${C.purple}22` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <span style={{ fontSize: 22 }}>🧠</span>
              <div style={{ fontSize: 16, fontWeight: 700, color: C.purple }}>Context Switching Tax</div>
            </div>
            <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.6 }}>
              Developers lose focus switching between tasks, reviews, and repos — deep work time disappears
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

}

    { label: "Codebase Intelligence", detail: "Detects project type, indexes repo, injects relevant context", color: C.purple },
    { label: "Historical Learning", detail: "Pulls lessons from past PRs — common review issues, success patterns", color: C.green },
    { label: "Implementation", detail: "Full repo access — reads files, writes code, creates tests", color: C.accent },
    { label: "Test Runner", detail: "Runs project tests — auto-fixes failures, retries up to N times", color: C.orange },
    { label: "Commit, Push & PR", detail: "Stages, commits, pushes to feature branch, opens PR with full details", color: C.green },

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px 16px" }}>
        {steps.map((s, i) => (

            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderRadius: 10, background: `${s.color}0a`, border: `1px solid ${s.color}22` }}>

              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: s.color }}>{s.label}</div>
                <div style={{ fontSize: 11, color: C.textDim, lineHeight: 1.4 }}>{s.detail}</div>

            <div style={{ fontSize: 12, color: C.textDim, marginBottom: 3 }}>Team</div>
            <div style={{ fontSize: 17, fontWeight: 600, color: C.text }}>Saras Analytics</div>
          </div>
        </div>
      </Rv>
    </div>
  );
}

/* 13 ── Q&A ────────────────────────────────────── */
function S13({ step }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", textAlign: "center" }}>
      <Rv visible={step >= 0}><Logo size={50} /></Rv>
      <Rv visible={step >= 0}><div style={{ fontSize: 64, marginBottom: 14 }}>❓</div></Rv>
      <Rv visible={step >= 0} delay={200}>
        <h1 style={{ fontSize: "clamp(34px, 3.8vw, 52px)", fontWeight: 800, color: C.text, margin: "0 0 10px" }}>Questions?</h1>
      </Rv>
      <Rv visible={step >= 1}>
        <p style={{ fontSize: 18, color: C.textMuted, margin: "0 0 28px" }}>Thank you!</p>
      </Rv>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   SLIDE REGISTRY + APP
   ═══════════════════════════════════════════════════ */

const SLIDES = [
  { C: S0,  title: "AutoShip",           max: 0 },
  { C: S1,  title: "The Problem",        max: 0 },
  { C: S2,  title: "The Solution",       max: 0 },
  { C: S3,  title: "Triggering",         max: 0 },
  { C: S4,  title: "Pipeline",           max: 0 },
  { C: S5,  title: "Codebase Intel & Learning", max: 0 },
  { C: S6,  title: "Multi-Repo",         max: 0 },
  { C: S7,  title: "Debate",             max: 0 },
  { C: S8,  title: "PR Auto-Fix",        max: 0 },
  { C: S9,  title: "Quality & Dashboard", max: 0 },
  { C: S10, title: "What's Next",        max: 0 },
  { C: S11, title: "Team Adoption",      max: 0 },
  { C: S12, title: "Demo",               max: 0 },
  { C: S13, title: "Q&A",                max: 0 },
];

function App() {
  const [si, setSi] = useState(0);
  const [step, setStep] = useState(0);
  const [fade, setFade] = useState(false);
  const [laser, setLaser] = useState(false);
  const [laserPos, setLaserPos] = useState({ x: -100, y: -100 });

  const cur = SLIDES[si];
  const Comp = cur.C;

  const next = useCallback(() => {
    if (fade) return;
    if (step < cur.max) setStep(s => s + 1);
    else if (si < SLIDES.length - 1) { setFade(true); setTimeout(() => { setSi(i => i + 1); setStep(0); setFade(false); }, 170); }
  }, [step, si, cur.max, fade]);

  const back = useCallback(() => {
    if (fade) return;
    if (step > 0) setStep(s => s - 1);
    else if (si > 0) { setFade(true); const p = SLIDES[si - 1]; setTimeout(() => { setSi(i => i - 1); setStep(p.max); setFade(false); }, 170); }
  }, [step, si, fade]);

  const goTo = useCallback((i) => {
    if (fade) return;
    setFade(true); setTimeout(() => { setSi(i); setStep(0); setFade(false); }, 170);
  }, [fade]);

  useEffect(() => {
    const h = (e) => {
      if (["ArrowRight"," ","Enter","PageDown"].includes(e.key)) { e.preventDefault(); next(); }
      else if (["ArrowLeft","Backspace","PageUp"].includes(e.key)) { e.preventDefault(); back(); }
      else if (e.key === "Home") { e.preventDefault(); goTo(0); }
      else if (e.key === "End") { e.preventDefault(); goTo(SLIDES.length - 1); }
      else if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
      else if (e.key === "l" || e.key === "L") { setLaser(v => !v); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [next, back, goTo]);

  useEffect(() => {
    const m = (e) => setLaserPos({ x: e.clientX, y: e.clientY });
    window.addEventListener("mousemove", m);
    return () => window.removeEventListener("mousemove", m);
  }, []);


  const progress = ((si + (step / (cur.max || 1))) / (SLIDES.length - 1)) * 100;
  const atEnd = si === SLIDES.length - 1 && step >= cur.max;
  const atStart = si === 0 && step === 0;

  return (
    <div style={{ width: "100%", height: "100vh", background: C.bg, display: "flex", flexDirection: "column", overflow: "hidden", cursor: laser ? "none" : "default" }}>
      {laser && <>
        <div style={{
          position: "fixed", left: laserPos.x - 12, top: laserPos.y - 12,
          width: 24, height: 24, borderRadius: "50%",
          background: "radial-gradient(circle, #ff2222 0%, #ff222299 35%, #ff222244 60%, transparent 75%)",
          boxShadow: "0 0 16px 6px #ff222266, 0 0 32px 12px #ff222233, 0 0 48px 18px #ff222211",
          pointerEvents: "none", zIndex: 99999,
        }} />
        <div style={{
          position: "fixed", left: laserPos.x - 4, top: laserPos.y - 4,
          width: 8, height: 8, borderRadius: "50%",
          background: "#fff", opacity: 0.9,
          pointerEvents: "none", zIndex: 100000,
        }} />
      </>}
      <div style={{ height: 3, background: C.border, flexShrink: 0 }}>
        <div style={{ height: "100%", background: `linear-gradient(90deg, ${C.accent}, ${C.cyan})`, width: `${progress}%`, transition: "width 0.3s ease" }} />
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "7px 24px", flexShrink: 0, borderBottom: `1px solid ${C.border}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Logo size={22} />
          <span style={{ fontSize: 13, fontWeight: 700, color: C.text }}>AutoShip</span>
          <span style={{ fontSize: 12, color: C.textDim }}>— {cur.title}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          {SLIDES.map((s, i) => (
            <div key={i} onClick={() => goTo(i)} title={s.title} style={{
              width: i === si ? 22 : 6, height: 6, borderRadius: 3,
              background: i === si ? C.accent : i < si ? C.accent + "55" : C.border,
              cursor: "pointer", transition: "all 0.3s",
            }} />
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 11, color: C.textDim }}>{si + 1}/{SLIDES.length}</span>
          <button onClick={() => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
          }} style={{ padding: "3px 8px", borderRadius: 5, border: `1px solid ${C.border}`, background: "transparent", color: C.textDim, fontSize: 11 }}>⛶</button>
        </div>
      </div>
      <div style={{
        flex: 1, padding: "24px 48px 16px", overflow: "auto",
        display: "flex", flexDirection: "column",
        opacity: fade ? 0 : 1, transform: fade ? "translateY(12px)" : "translateY(0)", transition: "opacity 0.22s ease, transform 0.22s ease",
      }}>
        <div style={{ margin: "auto 0", flex: "0 1 auto" }}><Comp step={step} /></div>
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 24px", borderTop: `1px solid ${C.border}`, flexShrink: 0 }}>
        <button onClick={(e) => { e.stopPropagation(); back(); }} disabled={atStart} style={{
          padding: "6px 18px", borderRadius: 7, border: `1px solid ${C.border}`,
          background: "transparent", color: C.textMuted, fontSize: 13, fontWeight: 600, opacity: atStart ? 0.3 : 1,
        }}>← Back</button>
        <div style={{ fontSize: 11, color: C.textDim }}>→ / Space to advance  •  L for laser  •  F for fullscreen</div>
        <button onClick={(e) => { e.stopPropagation(); next(); }} disabled={atEnd} style={{
          padding: "6px 18px", borderRadius: 7, border: "none",
          background: C.accent, color: "#fff", fontSize: 13, fontWeight: 600, opacity: atEnd ? 0.3 : 1,
        }}>Next →</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
