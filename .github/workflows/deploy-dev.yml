name: Pipeline
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  service_account_key: "${{ secrets.GKE_REGISTRY_KEY }}"
  PIPELINES_ACCESS_TOKEN: "${{ secrets.GH_ACCESS_TOKEN }}"
  REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/autoship
  VERSION: ${{ github.run_id }}

jobs:
  Build:
    name: Build
    runs-on: runner
    env:
      BUILD_ENV: dev
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.GKE_REGISTRY_KEY }}
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker Client
        run: |-
          gcloud auth configure-docker --quiet
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |-
          docker pull $REGISTRY/${{ github.event.repository.name }}-$BUILD_ENV:latest || true
          docker build \
            --cache-from $REGISTRY/${{ github.event.repository.name }}-$BUILD_ENV:latest \
            --platform linux/amd64 \
            -t $REGISTRY/${{ github.event.repository.name }}-$BUILD_ENV:$VERSION \
            -t $REGISTRY/${{ github.event.repository.name }}-$BUILD_ENV:latest \
            .
          docker push $REGISTRY/${{ github.event.repository.name }}-$BUILD_ENV:$VERSION
          docker push $REGISTRY/${{ github.event.repository.name }}-$BUILD_ENV:latest

  Deploy:
    name: Deploy to Dev
    needs: Build
    runs-on: runner
    env:
      BUILD_ENV: dev
      VALUES_FILE: dev-values.yaml

    container:
      image: bitnami/git

    steps:
      - uses: actions/checkout@v4

      - name: Update Helm values and push
        run: |-
          git clone https://oauth2:$PIPELINES_ACCESS_TOKEN@github.com/${{ github.repository }}.git repo
          cd repo
          git checkout argo-deployment
          sed -i "s|tag:.*|tag: \"${VERSION}\"|" helm/${VALUES_FILE}
          echo "$(cat helm/${VALUES_FILE} | grep tag) build image tag."
          git config --global user.email "ci@example.com"
          git config --global user.name "autoship-ci"
          git add helm/${VALUES_FILE}
          git commit -m "updating image tag $VERSION for $BUILD_ENV deployment" || true
          git push origin argo-deployment
