<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoShip — Sign In</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --border: #1e1e2e;
      --text: #e0e0e8;
      --text-muted: #6b6b7b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      
    }

    .ambience {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 800px 600px at 20% 50%, rgba(99, 102, 241, 0.05), transparent),
        radial-gradient(ellipse 600px 400px at 80% 20%, rgba(139, 92, 246, 0.03), transparent);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .login-card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 32px;
      background: #fff;
      color: #1f1f1f;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .google-btn:hover {
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
    }

    .error-msg {
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
    }

    .footer-text {
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

  </style>
</head>

<body>
  <div class="ambience"></div>

  <div class="login-card">
    <h1>AutoShip</h1>
    <p>Sign in to access the automation dashboard</p>

    <a href="/auth/google" class="google-btn">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4"
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
        <path fill="#34A853"
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
        <path fill="#FBBC05"
          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
        <path fill="#EA4335"
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
      </svg>
      Sign in with Google
    </a>

    <div id="errorMsg" class="error-msg"></div>

    <p class="footer-text">Restricted to your configured domain accounts</p>
  </div>

  <script>
    // Show error message from query params
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const el = document.getElementById('errorMsg');
      const messages = {
        'domain': 'Access restricted to authorized domain members.',
        'auth': 'Authentication failed. Please try again.',
        'no_email': 'Could not retrieve email from Google account.',
      };
      el.innerText = messages[error] || 'An error occurred during sign in.';
      el.style.display = 'block';
    }
  </script>
</body>

</html>
