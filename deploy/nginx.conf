# nginx reverse proxy config for clickup-claude-automation
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
#
# Prerequisites:
#   sudo apt install nginx apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd admin
#   # Enter password when prompted

upstream automation_backend {
    server 127.0.0.1:3457;
    keepalive 32;
}

server {
    listen 80;
    server_name your-autoship-domain.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-autoship-domain.example.com;

    # SSL — adjust paths to your cert location
    ssl_certificate     /etc/ssl/certs/your-domain.crt;
    ssl_certificate_key /etc/ssl/private/your-domain.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Request size limit (for large webhook payloads)
    client_max_body_size 10m;

    # ── Webhook endpoints (no auth — ClickUp/GitHub need direct access) ──
    location /webhook/ {
        proxy_pass http://automation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Health check (no auth) ──
    location /health {
        proxy_pass http://automation_backend/health;
        proxy_set_header Host $host;
    }

    # ── SSE events endpoint (needs special proxy settings) ──
    location /api/events {
        proxy_pass http://automation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Critical for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # ── Dashboard + API (auth protected via Google OAuth in-app) ──
    location / {
        proxy_pass http://automation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
