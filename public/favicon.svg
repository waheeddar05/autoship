<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1035"/>
      <stop offset="100%" stop-color="#060610"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>

  <!-- Rocket -->
  <g filter="url(#glow)" transform="translate(32, 30)">
    <!-- Exhaust -->
    <path d="M-3 18 L-9 28 Q0 24 9 28 L3 18" fill="url(#accent)" opacity="0.5"/>
    <path d="M-2 18 L-5 25 Q0 22 5 25 L2 18" fill="url(#accent)" opacity="0.7"/>

    <!-- Body -->
    <path d="M0 -22 Q-10 -8 -10 8 Q-10 15 -6 18 L-3 18 L-3 16 Q-7 14 -7 8 Q-7 -5 0 -17 Q7 -5 7 8 Q7 14 3 16 L3 18 L6 18 Q10 15 10 8 Q10 -8 0 -22Z"
          fill="url(#accent)"/>

    <!-- Window -->
    <circle cx="0" cy="-2" r="3.5" fill="#060610" stroke="#c084fc" stroke-width="0.8"/>
    <circle cx="-0.8" cy="-3" r="1" fill="#c084fc" opacity="0.5"/>

    <!-- Fins -->
    <path d="M-10 10 L-14 18 L-10 16 Z" fill="url(#accent)" opacity="0.8"/>
    <path d="M10 10 L14 18 L10 16 Z" fill="url(#accent)" opacity="0.8"/>
  </g>
</svg>
